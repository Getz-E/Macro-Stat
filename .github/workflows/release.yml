name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: Linux x86_64 paketi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bağımlılıklar
        run: sudo apt-get update && sudo apt-get install -y libevdev-dev pkg-config

      - name: Rust araç zinciri
        uses: dtolnay/rust-toolchain@stable

      - name: Motoru derle
        run: cargo build --release --locked

      - name: Dağıtım arşivi hazırla
        run: |
          set -euo pipefail
          NAME="macrostat-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir -p "dist/$NAME"
          cp target/release/cachymacro-daemon "dist/$NAME/"
          cp gui.py "dist/$NAME/"
          cp -r macrostat "dist/$NAME/"
          find "dist/$NAME/macrostat" -name '__pycache__' -type d -prune -exec rm -rf {} +
          cp -r assets "dist/$NAME/"
          cp baslat-arayuz.sh install_all.sh README.md LICENSE THIRD_PARTY.md requirements.txt "dist/$NAME/"
          chmod +x "dist/$NAME/cachymacro-daemon" "dist/$NAME/baslat-arayuz.sh" "dist/$NAME/install_all.sh"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          sha256sum "dist/$NAME.tar.gz" > "dist/$NAME.tar.gz.sha256"

      - name: Arşivi yükle
        uses: actions/upload-artifact@v4
        with:
          name: macrostat-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true

  # AppImage işi, GUI çalışması tamamlandıktan sonra build_appimage.sh ile eklenecek.
