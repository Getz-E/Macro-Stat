name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust motoru (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust araç zinciri
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Biçim denetimi
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Birim testleri
        run: cargo test --release --locked

  msrv:
    name: Rust 1.79 (MSRV) derleme + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust 1.79 araç zinciri
        uses: dtolnay/rust-toolchain@c177d57752bc15d75a239e904291e3c5079759ce # 1.79
        with:
          toolchain: "1.79"
      - name: Kilitleyiciyle derle ve test et
        run: cargo test --release --locked

  distro:
    name: Kurulum doğrulaması (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            family: debian
            distro: ubuntu
            python_cmd: python3
          - name: Debian 13
            image: debian:trixie
            family: debian
            distro: debian
            python_cmd: python3
          - name: Fedora 41
            image: fedora:41
            family: fedora
            distro: fedora
            python_cmd: python3
          - name: Arch Linux
            image: archlinux:latest
            family: arch
            distro: arch
            python_cmd: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Paketler, motor araç zinciri ve arayüz doğrulaması
        env:
          IMAGE: ${{ matrix.image }}
          DISTRO_FAMILY: ${{ matrix.family }}
          EXPECTED_DISTRO: ${{ matrix.distro }}
          PYTHON_CMD: ${{ matrix.python_cmd }}
        run: |
          # Tek container: paketler kurulduktan sonra PyQt6 ve betik
          # sözdizimi denetimleri aynı ortamda çalışır.
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src \
            -e DISTRO_FAMILY -e EXPECTED_DISTRO -e PYTHON_CMD \
            "$IMAGE" bash -c '
              set -euo pipefail
              source packaging/install-common.sh
              # archlinux imajı boş paket veritabanıyla gelir; senkronize etmeden
              # pacman "target not found" verir.
              if [ "$DISTRO_FAMILY" = arch ]; then
                pacman -Syu --noconfirm
              fi
              install_packages
              require_rust
              "$PYTHON_CMD" --version
              cargo --version
              "$PYTHON_CMD" -c "import PyQt6.QtCore"
              bash -n install_all.sh install_arch.sh install_ubuntu.sh \
                install_debian.sh install_fedora.sh uninstall.sh \
                packaging/install-common.sh
              echo "Kurulum doğrulaması tamam."
            '

  audit:
    name: Bağımlılık güvenlik denetimi (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust araç zinciri
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: cargo-audit
        run: |
          set -euo pipefail
          cargo install --locked cargo-audit --version 0.22.2
          installed="$(cargo-audit --version | awk '{print $2}')"
          test "$installed" = "0.22.2"
          cargo audit

  python:
    name: PyQt6 arayüzü (sözdizimi + birim + duman testi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Qt sistem kütüphaneleri (libEGL / libGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1
      - name: PyQt6 kur
        run: pip install -r requirements.txt
      - name: Sözdizimi denetimi
        run: python -m py_compile gui.py macrostat/*.py
      - name: Python birim testleri
        run: python -m unittest discover -s tests -v
      - name: Betik sözdizimi
        run: |
          bash -n start-macrostat.sh packaging/macrostat
          bash -n install_all.sh install_arch.sh install_ubuntu.sh \
            install_debian.sh install_fedora.sh uninstall.sh \
            packaging/install-common.sh
      - name: Offscreen arayüz duman testi
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          import sys
          from PyQt6.QtWidgets import QApplication
          from macrostat import app as app_mod, common
          app_mod.MacroStatApp.check_and_auto_start_daemon = lambda self: None
          app_mod.MacroStatApp.update_daemon_status = lambda self: None
          common.cleanup_daemon = lambda: None
          app = QApplication(sys.argv)
          window = app_mod.MacroStatApp()
          app.processEvents()
          assert window.tabs.count() == 4
          window._force_close = True
          window.close()
          print("GUI OK")
          PY
