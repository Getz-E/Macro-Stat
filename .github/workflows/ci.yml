name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust motoru (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust araç zinciri
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Biçim denetimi
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --release -- -D warnings
      - name: Birim testleri
        run: cargo test --release

  msrv:
    name: Rust 1.75 (MSRV) derleme + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust 1.75 araç zinciri
        uses: dtolnay/rust-toolchain@1.75
      - name: Kilitleyiciyle derle ve test et
        run: cargo test --release --locked

  distro:
    name: Kurulum doğrulaması (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            python_cmd: python3
            command: >-
              bash -c 'set -euo pipefail; source packaging/install-common.sh; DISTRO_FAMILY=debian;
              EXPECTED_DISTRO=ubuntu; install_packages; require_rust'
          - name: Debian 13
            image: debian:trixie
            python_cmd: python3
            command: >-
              bash -c 'set -euo pipefail; source packaging/install-common.sh; DISTRO_FAMILY=debian;
              EXPECTED_DISTRO=debian; install_packages; require_rust'
          - name: Fedora 41
            image: fedora:41
            python_cmd: python3
            command: >-
              bash -c 'set -euo pipefail; source packaging/install-common.sh; DISTRO_FAMILY=fedora;
              EXPECTED_DISTRO=fedora; install_packages; require_rust'
          - name: Arch Linux
            image: archlinux:latest
            python_cmd: python
            command: >-
              bash -c 'set -euo pipefail; source packaging/install-common.sh; DISTRO_FAMILY=arch;
              EXPECTED_DISTRO=arch; install_packages; require_rust'
    steps:
      - uses: actions/checkout@v4
      - name: Paket yöneticisi + motor araç zinciri
        env:
          DISTRO_COMMAND: ${{ matrix.command }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src \
            "${{ matrix.image }}" bash -c "$DISTRO_COMMAND"
      - name: PyQt6 ve betik sözdizimi
        env:
          DISTRO_COMMAND: >-
            ${{ matrix.python_cmd }} -c 'import PyQt6.QtCore' &&
            bash -n install_all.sh install_arch.sh install_ubuntu.sh
            install_debian.sh install_fedora.sh uninstall.sh
            packaging/install-common.sh
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src \
            "${{ matrix.image }}" bash -c "$DISTRO_COMMAND"

  audit:
    name: Bağımlılık güvenlik denetimi (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo-audit
        run: |
          cargo install --locked cargo-audit
          cargo audit

  python:
    name: PyQt6 arayüzü (sözdizimi + birim + duman testi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PyQt6 kur
        run: pip install "PyQt6>=6.5"
      - name: Sözdizimi denetimi
        run: python -m py_compile gui.py macrostat/*.py
      - name: Python birim testleri
        run: python -m unittest discover -s tests -v
      - name: Betik sözdizimi
        run: |
          bash -n start-macrostat.sh packaging/macrostat
          bash -n install_all.sh install_arch.sh install_ubuntu.sh \
            install_debian.sh install_fedora.sh uninstall.sh \
            packaging/install-common.sh
      - name: Offscreen arayüz duman testi
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          import sys
          from PyQt6.QtWidgets import QApplication
          from macrostat import app as app_mod, common
          app_mod.MacroStatApp.check_and_auto_start_daemon = lambda self: None
          app_mod.MacroStatApp.update_daemon_status = lambda self: None
          common.cleanup_daemon = lambda: None
          app = QApplication(sys.argv)
          window = app_mod.MacroStatApp()
          app.processEvents()
          assert window.tabs.count() == 4
          window._force_close = True
          window.close()
          print("GUI OK")
          PY
