[package]
name = "macrostat-daemon"
version = "1.0.0"
edition = "2021"
# Ubuntu 24.04 / Debian 13 depolarındaki rustc sürümleriyle uyumlu taban.
rust-version = "1.75"
authors = ["MacroStat Author"]
description = "Low-latency offline macro engine for Linux (evdev/uinput, X11 and KDE Wayland)"
license = "GPL-3.0-or-later"
readme = "README.md"

[dependencies]
evdev = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
libc = "0.2"
# KDE Wayland'da imleci mutlak konuma taşımak için (org_kde_kwin_fake_input).
# `dlopen` özelliği libwayland'a derleme zamanı bağımlılığını kaldırır.
# Not: wayland-scanner 0.31.11+ quick-xml ^0.41 ister (MSRV 1.79). Ubuntu
# 24.04'ün rustc 1.75'i için Cargo.lock'ta 0.31.10'a sabitlendi; `cargo update`
# sonrası MSRV işi kırılırsa bu sürümü koruyun.
wayland-client = { version = "0.31", features = ["dlopen"] }
wayland-scanner = "0.31"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
