[package]
name = "macrostat-daemon"
version = "1.0.0"
edition = "2021"
# Ubuntu 24.04'ün depo rustc'si 1.75; kurulum betiği `rustc-1.79` sürümlü
# pakete düşer. Debian 13 / Fedora 41 / Arch depolarındaki rustc yeterli.
rust-version = "1.79"
authors = ["MacroStat Author"]
description = "Low-latency offline macro engine for Linux (evdev/uinput, X11 and KDE Wayland)"
license = "GPL-3.0-or-later"
readme = "README.md"

[dependencies]
evdev = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
libc = "0.2"
# KDE Wayland'da imleci mutlak konuma taşımak için (org_kde_kwin_fake_input).
# `dlopen` özelliği libwayland'a derleme zamanı bağımlılığını kaldırır.
# Not: wayland-scanner 0.31.11+ güvenli quick-xml 0.41'i getirir (RUSTSEC-2026-0194/0195).
# quick-xml 0.41 MSRV'si 1.79'dur; bu yüzden projenin tabanı 1.79'dur.
wayland-client = { version = "0.31", features = ["dlopen"] }
wayland-scanner = "0.31"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
